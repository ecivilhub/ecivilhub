<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — eCivilHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.logo{font-size:20px;font-weight:700;color:#1e3a5f;margin-bottom:20px}
.logo span{color:#2563eb;font-weight:400}
h2{font-size:18px;font-weight:700;color:#0f172a;margin-bottom:4px}
p{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.6}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px}
.fg input{width:100%;padding:9px 11px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:13.5px;font-family:inherit;background:#f8fafc;color:#0f172a;outline:none;transition:border-color .12s}
.fg input:focus{border-color:#2563eb;background:#fff}
.btn{width:100%;padding:11px;background:#1e3a5f;border:none;border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px}
.btn:hover{background:#2a4f7c}
.btn:disabled{background:#cbd5e1;cursor:not-allowed}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:8px 12px;color:#dc2626;font-size:12.5px;margin-bottom:12px;display:none}
.err.show{display:block}
.ok{background:#f0fdf4;border:1px solid #86efac;border-radius:5px;padding:8px 12px;color:#16a34a;font-size:12.5px;margin-bottom:12px;display:none}
.ok.show{display:block}
.back{text-align:center;margin-top:16px;font-size:13px}
.back a{color:#2563eb;font-weight:600;text-decoration:none}
.hint{font-size:12px;color:#94a3b8;margin-top:4px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">eCivil<span>Hub</span></div>
  <h2>Set Your Password</h2>
  <p>Enter your email, the code from the email you received, and your new password.</p>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <div class="fg">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="fg">
    <label>Reset Code</label>
    <input type="text" id="otp" placeholder="Enter code from email" maxlength="20">
    <div class="hint">Check your email for the code (reset or invite)</div>
  </div>
  <div class="fg">
    <label>New Password</label>
    <input type="password" id="pass" placeholder="Minimum 6 characters">
  </div>
  <div class="fg">
    <label>Confirm Password</label>
    <input type="password" id="pass2" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doReset()">
  </div>
  <button class="btn" id="btn" onclick="doReset()">Set New Password</button>
  <div class="back"><a href="/">← Back to eCivilHub</a></div>
</div>

<script>

const SUPA_URL = 'https://xoeenzntwqsuckbofhgg.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvZWVuem50d3FzdWNrYm9maGdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjI5NDUsImV4cCI6MjA5NDM5ODk0NX0.vU6X1U5I6ZxlK_aD334P9X6xqveLhlgLXMBta3ph2dM';
const db = {
  async get(table, params='') {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async insert(table, data, token) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(token||SUPA_KEY),'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async update(table, id, data, idCol, token) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${idCol||'id'}=eq.${id}`, {method:'PATCH',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(token||SUPA_KEY),'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async delete(table, id, idCol, token) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${idCol||'id'}=eq.${id}`, {method:'DELETE',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(token||SUPA_KEY)}});
    if(!r.ok) throw new Error(await r.text());
    return true;
  },
  async signIn(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d = await r.json();
    if(d.error) throw new Error(d.error_description||d.error);
    return d;
  },
  async signUp(email, password, name) {
    const r = await fetch(`${SUPA_URL}/auth/v1/signup`, {method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:name}})});
    const d = await r.json();
    if(d.error) throw new Error(d.error_description||d.error);
    return d;
  },
  async signOut(token) {
    await fetch(`${SUPA_URL}/auth/v1/logout`, {method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}});
  },
  async getUser(token) {
    const r = await fetch(`${SUPA_URL}/auth/v1/user`, {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}});
    if(!r.ok) return null;
    return r.json();
  }
};
function getSession(){try{return JSON.parse(localStorage.getItem('ech_session'));}catch(e){return null;}}
function setSession(s){localStorage.setItem('ech_session',JSON.stringify(s));}
function clearSession(){localStorage.removeItem('ech_session');}
function getToken(){var s=getSession();return s?s.access_token:null;}


// Auto-fill email and token from URL if present
window.addEventListener('load', function(){
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var token = params.get('token') || params.get('access_token') || '';
  var email = params.get('email') || '';
  if(email) document.getElementById('email').value = email;
  if(token) document.getElementById('otp').value = token;
  if(email && token){
    // Auto-focus password field
    document.getElementById('pass').focus();
  }
});

async function doReset(){
  var email = document.getElementById('email').value.trim();
  var otp   = document.getElementById('otp').value.trim();
  var pass  = document.getElementById('pass').value;
  var pass2 = document.getElementById('pass2').value;
  var err   = document.getElementById('err');
  var ok    = document.getElementById('ok');
  var btn   = document.getElementById('btn');
  
  err.className='err'; ok.className='ok';
  
  if(!email){err.textContent='Please enter your email';err.className='err show';return;}
  if(!otp){err.textContent='Please enter the reset code from your email';err.className='err show';return;}
  if(!pass||pass.length<6){err.textContent='Password must be at least 6 characters';err.className='err show';return;}
  if(pass!==pass2){err.textContent='Passwords do not match';err.className='err show';return;}
  
  btn.disabled=true;btn.textContent='Verifying...';
  
  try{
    // Step 1: Verify OTP — try recovery first, then invite
    var r1, d1;
    r1 = await fetch(SUPA_URL+'/auth/v1/verify',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({type:'recovery',email:email,token:otp})
    });
    d1 = await r1.json();
    if(!r1.ok){
      // Try as invite type
      r1 = await fetch(SUPA_URL+'/auth/v1/verify',{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({type:'invite',email:email,token:otp})
      });
      d1 = await r1.json();
      if(!r1.ok) throw new Error(d1.message||d1.error_description||'Invalid code or email. Please check and try again.');
    }
    
    var accessToken = d1.access_token;
    if(!accessToken) throw new Error('Could not get session. Please request a new reset link.');
    
    btn.textContent='Updating password...';
    
    // Step 2: Update password using the session token
    var r2 = await fetch(SUPA_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:JSON.stringify({password:pass})
    });
    var d2 = await r2.json();
    if(!r2.ok) throw new Error(d2.message||d2.msg||'Failed to update password.');
    
    ok.textContent='Password updated successfully! Taking you to login...';
    ok.className='ok show';
    setTimeout(function(){window.location.href='/';},2000);
    
  }catch(e){
    err.textContent=e.message;
    err.className='err show';
    btn.disabled=false;btn.textContent='Set New Password';
  }
}
</script>
</body>
</html>
